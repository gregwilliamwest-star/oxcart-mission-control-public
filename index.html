<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Oxcart Mission Control (public, read-only)</title>
<link rel="alternate" type="application/json" href="data/state.json">
<style>
:root{--bg:#0f1216;--panel:#171c22;--line:#262d36;--tx:#e6e9ed;--mut:#8a94a1;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--info:#58a6ff}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--line:#d9dde3;--tx:#1b1f24;--mut:#5b6573}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0 0 4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 16px 8px}
.mut{color:var(--mut)}.small{font-size:12px}a{color:var(--info)}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;padding:0 16px;overflow-x:auto}
.col,.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.col h3{margin:2px 4px 6px;font-size:12px;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin-bottom:6px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:0 16px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.s-Running,.s-OPEN{color:var(--ok)}.s-Idle{color:var(--info)}.s-Waiting,.s-Stale{color:var(--warn)}.s-Blocked,.s-Disconnected{color:var(--bad)}.s-Reviewing{color:var(--info)}.s-Completed,.s-CLOSED{color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
code{font-family:Consolas,monospace;font-size:12px}.bad{color:var(--bad)}
</style></head><body>
<header><h1>Oxcart Mission Control <span class="mut">(public, read-only snapshot)</span></h1>
<div class="small mut" id="meta">loading...</div>
<div class="small mut">Machine-readable: <a href="data/state.json">data/state.json</a> · <a href="data/issues.json">data/issues.json</a> · <a href="data/status.json">data/status.json</a> · <a href="llms.txt">llms.txt</a></div></header>
<h2>Kanban</h2><div class="board" id="board"></div>
<h2>Agents</h2><div class="grid" id="agents"></div>
<h2>GitHub issues</h2><div class="panel" style="margin:0 16px"><table id="issues"></table></div>
<h2>Recent activity</h2><div class="panel" style="margin:0 16px"><table id="events"></table></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=s=>`<span class="pill s-${esc(String(s).split(" ")[0])}">${esc(s)}</span>`;
async function load(){
 try{
  const [s,i]=await Promise.all([fetch("data/state.json",{cache:"no-store"}).then(r=>r.json()),fetch("data/issues.json",{cache:"no-store"}).then(r=>r.json())]);
  const age=(Date.now()-Date.parse(s.generated))/60000;
  meta.innerHTML=`snapshot ${esc(s.generated)} (${age<1?"under a minute":Math.round(age)+" min"} old)${age>s.stale_after_minutes?' <b class="bad">STALE: the dev machine may be offline</b>':""} · refreshes every 30 s · this page cannot change anything`;
  board.innerHTML=Object.entries(s.columns).map(([c,ids])=>`<div class="col"><h3>${esc(c)} (${ids.length})</h3>`+ids.map(id=>{const t=s.tasks.find(x=>x.id===id);return `<div class="card"><b>${esc(t.id)}</b> ${esc(t.title)}<div class="small mut">${esc(t.assigned_agent||"unassigned")} · ~${t.progress_pct??"?"}% (est.)${t.last_test?" · test: "+esc(t.last_test):""}${t.last_review?" · review: "+esc(t.last_review):""}</div></div>`}).join("")+`</div>`).join("");
  agents.innerHTML=s.agents.map(a=>`<div class="panel"><b>${esc(a.id)}</b> ${pill(a.status)}<div class="small mut">${esc(a.role)}</div><div class="small">${a.current_task?"task "+esc(a.current_task)+" · ":""}${a.last_heartbeat?"last heartbeat ~"+esc(a.last_heartbeat.slice(5,16).replace("T"," "))+" UTC":"not launched"}${a.note?"<br>"+esc(a.note):""}</div>${a.branch?`<div class="small"><code>${esc(a.branch)}</code></div>`:""}</div>`).join("");
  issues.innerHTML=`<tr><th>#</th><th>title</th><th>status</th><th>priority</th><th>progress (estimate)</th><th>agent</th><th>details</th></tr>`+i.issues.map(x=>x.withheld?`<tr><td>${x.number}</td><td class="mut" colspan="6">withheld (internal)</td></tr>`:`<tr><td>${x.number}</td><td>${esc(x.title)}<div class="small mut">${esc(x.labels.join(", "))}</div></td><td>${pill(x.status)}</td><td class="small">${esc(x.priority)}</td><td class="small">${x.progress_pct==null?"n/a":"~"+x.progress_pct+"% (est.)"}</td><td class="small">${esc(x.assigned_agent||"")}</td><td class="small mut">${esc(x.description||"")}${x.dependencies.length?"<br>depends: "+esc(x.dependencies.join("; ")):""}${x.acceptance_criteria.length?"<br>accept: "+esc(x.acceptance_criteria.join("; ")):""}</td></tr>`).join("");
  events.innerHTML=`<tr><th>time</th><th>kind</th><th>agent</th><th>task</th><th>text</th></tr>`+s.events.slice(0,30).map(e=>`<tr><td class="small">${esc((e.time||"").slice(5,19).replace("T"," "))}</td><td>${esc(e.kind)}</td><td>${esc(e.agent||"")}</td><td>${esc(e.task||"")}</td><td>${esc(e.text||"")}</td></tr>`).join("");
 }catch(e){meta.textContent="could not load snapshot: "+e}
}
load();setInterval(load,30000);
</script></body></html>
